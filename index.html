<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Postula una interacción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centered form column (max 720px) */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#14213D; --muted:#5A6472; --line:#DDE2E9;
  --navy:#0A1F5C; --blue:#0B4AA2; --mist:#E3E7ED; --warn:#9A5B00;
  --display:'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#161E33; --ink:#E8EDF5; --muted:#A3AEBF; --line:#2A3550;
  --navy:#9EC1E8; --blue:#7FB0EC; --mist:#222C44; --warn:#F2C073; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,42px);line-height:1.05;margin:0;color:var(--navy);text-wrap:balance}
.lede{color:var(--muted);margin:0}
form{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:20px}
label.f{display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:16px}
.num{font-family:var(--display);color:var(--blue);margin-right:4px}
.opt{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:104px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;background:var(--mist);color:var(--ink);border-radius:999px;padding:5px 10px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font:600 16px var(--body);border-radius:8px;padding:12px 20px;cursor:pointer;border:1px solid var(--navy)}
.btn.primary{background:var(--navy);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.msg{font-size:15px}
.msg.err{color:var(--warn)}
.done h2{font-family:var(--display);font-size:28px;margin:0;color:var(--navy)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Agilidad EP · Inteligencia colaborativa</div>
    <h1>Postula una interacción entre áreas para mejorar</h1>
    <p class="lede">Buscamos interacciones reales entre áreas que, si mejoran, tendrían un alto impacto. Con las postulaciones elegimos dónde intervenir con una célula ágil.</p>
  </header>

  <section id="viewForm">
    <form id="f" novalidate>
      <div class="card">
        <label class="f" for="postulante">Tu nombre
          <input type="text" id="postulante" maxlength="120" autocomplete="name">
        </label>
        <label class="f" for="interaccion"><span><span class="num">1</span>¿Qué interacción propones mejorar?</span>
          <textarea id="interaccion" maxlength="1500" placeholder="Ej.: la aprobación de compras menores de repuestos entre planta, compras y finanzas."></textarea>
        </label>
        <label class="f" for="areaIn"><span><span class="num">2</span>¿Cuáles son las áreas involucradas? <span class="opt">escribe un área y pulsa Enter</span></span>
          <input type="text" id="areaIn" maxlength="60" placeholder="Ej.: Compras, Finanzas, Planta">
        </label>
        <div class="chips" id="areas" aria-live="polite"></div>
        <label class="f" for="impacto"><span><span class="num">3</span>¿Por qué consideras que es de alto impacto?</span>
          <textarea id="impacto" maxlength="1500" placeholder="Qué se gana si mejora: tiempo, ventas, costos, experiencia del cliente…"></textarea>
        </label>
      </div>
      <div class="actions">
        <button class="btn primary" type="submit" id="send">Enviar postulación</button>
        <span class="msg" id="msg" role="status"></span>
      </div>
    </form>
  </section>

  <section id="viewDone" class="card done" hidden>
    <div class="eyebrow">Postulación recibida</div>
    <h2>¡Gracias!</h2>
    <p id="doneTxt" style="margin:0;color:var(--muted)"></p>
    <div class="actions"><button class="btn ghost" type="button" id="again">Postular otra interacción</button></div>
  </section>
</div>

<script>
(function(){
const CONFIG={
  // Pega aquí la URL de tu app web de Google Apps Script (termina en /exec).
  // Si la dejas vacía, la página funciona en "modo de prueba" y no guarda nada.
  API_URL:'https://script.google.com/macros/s/AKfycbzX-c2MQUh57I6UeA_AOgWn_GDDgF9HT_KS6x0vIDAla2TRbjcWRAz5NkkuXETM_mTV/exec'
};
const $=id=>document.getElementById(id);
const state={areas:[]};

function renderAreas(){
  const box=$('areas');box.textContent='';
  state.areas.forEach((a,i)=>{const c=document.createElement('span');c.className='chip';const t=document.createElement('span');t.textContent=a;const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Quitar '+a);b.textContent='×';b.onclick=()=>{state.areas.splice(i,1);renderAreas()};c.append(t,b);box.appendChild(c)});
}
function addArea(){const v=$('areaIn').value.split(',').map(s=>s.trim()).filter(Boolean);v.forEach(x=>{if(!state.areas.some(y=>y.toLowerCase()===x.toLowerCase())&&state.areas.length<15)state.areas.push(x)});$('areaIn').value='';renderAreas()}
$('areaIn').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();addArea()}});
$('areaIn').addEventListener('blur',()=>{if($('areaIn').value.trim())addArea()});

function showMsg(t,err){const m=$('msg');m.textContent=t;m.className='msg'+(err?' err':'')}
$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  if($('areaIn').value.trim())addArea();
  const item={fecha:new Date().toISOString(),postulante:$('postulante').value.trim(),interaccion:$('interaccion').value.trim(),
    areas:state.areas.join('; '),numAreas:state.areas.length,impacto:$('impacto').value.trim()};
  const missing=[];
  if(!item.postulante)missing.push('tu nombre');
  if(!item.interaccion)missing.push('la interacción');
  if(!item.numAreas)missing.push('las áreas');
  if(!item.impacto)missing.push('por qué es de alto impacto');
  if(missing.length){showMsg('Falta completar '+missing.join(', ')+'.',true);return}
  $('send').disabled=true;showMsg('Enviando…');
  try{
    if(CONFIG.API_URL){
      const res=await fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(item)});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const out=await res.json();
      if(!out||!out.ok)throw new Error('respuesta');
    }
    $('doneTxt').textContent=(CONFIG.API_URL?'':'Modo de prueba: esta postulación no se guardó. ')+'Recibimos tu propuesta. La revisaremos junto con las demás para elegir dónde intervenir con una célula ágil.';
    $('viewForm').hidden=true;$('viewDone').hidden=false;showMsg('');window.scrollTo(0,0);
  }catch(err){
    showMsg('No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.',true);
  }finally{$('send').disabled=false}
});
$('again').addEventListener('click',()=>{$('f').reset();state.areas=[];renderAreas();$('viewDone').hidden=true;$('viewForm').hidden=false;window.scrollTo(0,0)});
})();
</script>
</body>
</html>
