<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Postulaciones en vivo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header + key gate; summary tiles, top-areas bars, then the list of suggestions */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#14213D; --muted:#5A6472; --line:#DDE2E9;
  --navy:#0A1F5C; --blue:#0B4AA2; --mist:#E3E7ED; --ok:#1E7A4C; --ok-bg:#E3F3EA; --warn:#9A5B00;
  --display:'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#161E33; --ink:#E8EDF5; --muted:#A3AEBF; --line:#2A3550;
  --navy:#9EC1E8; --blue:#7FB0EC; --mist:#222C44; --ok:#7FD3A4; --ok-bg:#16382A; --warn:#F2C073; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.05;margin:0;color:var(--navy)}
h2{font-family:var(--display);font-size:20px;margin:0;color:var(--navy)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}
.dot.off{background:var(--muted);box-shadow:none}
.btn{font:600 15px var(--body);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--navy);background:transparent;color:var(--navy)}
.btn.primary{background:var(--navy);color:var(--surface)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.gate{max-width:420px}
.gate input{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.err{color:var(--warn);font-size:15px;margin:0}
.top{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.top{grid-template-columns:minmax(0,1fr)}}
.tiles{display:flex;flex-direction:column;gap:16px}
.tile b{display:block;font-family:var(--display);font-size:40px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.tile span{font-size:14px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:15px;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;font-family:inherit}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar[aria-pressed="true"] span:first-child{font-weight:700;color:var(--navy)}
.track{height:14px;background:var(--mist);border-radius:7px;overflow:hidden}
.fill{height:100%;border-radius:7px;background:var(--blue)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.filtro{font-size:15px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.item h3{margin:0;font-size:17px;line-height:1.35}
.item p{margin:0}
.meta{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:500;background:var(--mist);border-radius:999px;padding:3px 10px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.empty{padding:28px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">Agilidad EP · Células ágiles</div>
      <h1>Postulaciones en vivo</h1>
    </div>
    <div class="live" id="live" hidden>
      <span class="dot" id="dot"></span><span id="hora">Actualizando…</span>
      <button class="btn" type="button" id="refresh">Actualizar</button>
    </div>
  </div>

  <form class="card gate" id="gate" autocomplete="off">
    <h2>Ingresa la clave de resultados</h2>
    <input type="password" id="clave" aria-label="Clave de resultados" autocomplete="current-password">
    <button class="btn primary" type="submit" id="entrar">Ver resultados</button>
    <p class="err" id="gateErr" role="status"></p>
  </form>

  <section id="dash" hidden>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="top">
        <div class="tiles">
          <div class="card tile"><b id="tTotal">0</b><span>postulaciones</span></div>
          <div class="card tile"><b id="tAreas">0</b><span>áreas distintas mencionadas</span></div>
        </div>
        <div class="card"><h2>Áreas más mencionadas</h2><p class="meta" style="margin:0">Toca un área para ver solo sus postulaciones.</p><div class="bars" id="areasBars"></div></div>
      </div>
      <div class="toolbar">
        <span class="filtro" id="filtro">Mostrando todas las postulaciones</span>
        <button class="btn" type="button" id="csv">Descargar CSV</button>
      </div>
      <div class="list" id="list"></div>
    </div>
  </section>
</div>

<script>
(function(){
const CONFIG={
  // La misma URL de Apps Script que usa el formulario (termina en /exec).
  API_URL:'https://script.google.com/macros/s/AKfycbzX-c2MQUh57I6UeA_AOgWn_GDDgF9HT_KS6x0vIDAla2TRbjcWRAz5NkkuXETM_mTV/exec',
  REFRESCO_SEG:30
};
const $=id=>document.getElementById(id);
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
let clave=ss.get('clave-resultados')||'',filas=[],timer=null,areaSel='';

const norm=a=>a.trim().replace(/\s+/g,' ');
const key=a=>norm(a).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const areasDe=f=>String(f.areas||'').split(/[;,]/).map(norm).filter(Boolean);

async function cargar(){
  const res=await fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify({accion:'resultados',clave})});
  if(!res.ok)throw {m:'No se pudieron cargar los resultados.'};
  const r=await res.json();
  if(!r.ok){
    const M={clave:'Clave incorrecta.',bloqueado:'Demasiados intentos. Espera 10 minutos e intenta de nuevo.',sin_clave:'Falta configurar la clave en Apps Script (ver LEEME.md).'};
    throw {m:M[r.motivo]||'No se pudieron cargar los resultados.',auth:r.motivo==='clave'||r.motivo==='bloqueado'};
  }
  filas=(r.filas||[]).slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  $('hora').textContent='Actualizado a las '+new Date(r.hora||Date.now()).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
  $('dot').classList.remove('off');
  render();
}
async function refrescar(){
  try{await cargar()}catch(e){
    if(e.auth){salir(e.m);return}
    $('dot').classList.add('off');$('hora').textContent='Sin conexión · reintentando';
  }
}
function programar(){clearInterval(timer);timer=setInterval(()=>{if(document.visibilityState==='visible')refrescar()},CONFIG.REFRESCO_SEG*1000)}
function salir(msg){clearInterval(timer);ss.del('clave-resultados');clave='';$('dash').hidden=true;$('live').hidden=true;$('gate').hidden=false;$('gateErr').textContent=msg||''}
function mostrar(){$('gate').hidden=true;$('dash').hidden=false;$('live').hidden=false;$('gateErr').textContent='';programar()}
$('gate').addEventListener('submit',async e=>{
  e.preventDefault();clave=$('clave').value.trim();if(!clave)return;
  $('entrar').disabled=true;$('gateErr').textContent='Cargando…';
  try{await cargar();ss.set('clave-resultados',clave);mostrar()}catch(err){$('gateErr').textContent=err.m||'No se pudieron cargar los resultados.'}
  finally{$('entrar').disabled=false}
});
$('refresh').onclick=refrescar;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('dash').hidden)refrescar()});

function conteoAreas(){
  const m=new Map();
  filas.forEach(f=>{const vistos=new Set();areasDe(f).forEach(a=>{const k=key(a);if(vistos.has(k))return;vistos.add(k);const e=m.get(k)||{label:a,n:0};e.n++;m.set(k,e)})});
  return [...m.entries()].map(([k,v])=>({k,label:v.label,n:v.n})).sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label));
}
function render(){
  const areas=conteoAreas();
  $('tTotal').textContent=filas.length;
  $('tAreas').textContent=areas.length;
  const box=$('areasBars');box.textContent='';
  const top=areas.slice(0,8),max=Math.max(1,...top.map(a=>a.n));
  if(!top.length){box.innerHTML='<p class="meta" style="margin:0">Aún no hay áreas.</p>'}
  top.forEach(a=>{
    const b=document.createElement('button');b.type='button';b.className='bar';b.setAttribute('aria-pressed',String(areaSel===a.k));
    const l=document.createElement('span');l.textContent=a.label;
    const t=document.createElement('span');t.className='track';const f=document.createElement('span');f.className='fill';f.style.display='block';f.style.width=(a.n/max*100)+'%';t.appendChild(f);
    const n=document.createElement('span');n.className='n';n.textContent=a.n;
    b.append(l,t,n);b.onclick=()=>{areaSel=areaSel===a.k?'':a.k;render()};box.appendChild(b);
  });
  const lista=areaSel?filas.filter(f=>areasDe(f).some(a=>key(a)===areaSel)):filas;
  const sel=areas.find(a=>a.k===areaSel);
  $('filtro').textContent=sel?`Mostrando ${lista.length} postulaciones con ${sel.label} · toca de nuevo el área para ver todas`:'Mostrando todas las postulaciones';
  const L=$('list');L.textContent='';
  if(!lista.length){const d=document.createElement('div');d.className='card empty';d.textContent='Aún no hay postulaciones. Aparecerán aquí en cuanto alguien envíe el formulario.';L.appendChild(d);return}
  lista.forEach(f=>{
    const c=document.createElement('article');c.className='card item';
    const h=document.createElement('h3');h.textContent=f.interaccion||'(sin descripción)';
    const ch=document.createElement('div');ch.className='chips';areasDe(f).forEach(a=>{const s=document.createElement('span');s.className='chip';s.textContent=a;ch.appendChild(s)});
    const lb=document.createElement('div');lb.className='lbl';lb.textContent='Por qué es de alto impacto';
    const im=document.createElement('p');im.textContent=f.impacto||'';
    const m=document.createElement('div');m.className='meta';
    const fecha=f.fecha?new Date(f.fecha).toLocaleDateString('es-VE',{day:'numeric',month:'short'}):'';
    m.textContent=[f.postulante?'Postuló: '+f.postulante:'',fecha].filter(Boolean).join(' · ');
    c.append(h,ch,lb,im,m);L.appendChild(c);
  });
}
$('csv').onclick=()=>{
  const cols=[['Fecha','fecha'],['Postulado por','postulante'],['Interacción a mejorar','interaccion'],['Áreas involucradas','areas'],['N.º de áreas','numAreas'],['Por qué es de alto impacto','impacto']];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const txt='﻿'+[cols.map(c=>q(c[0])).join(',')].concat(filas.map(f=>cols.map(([,k])=>q(f[k])).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download='postulaciones-interacciones.csv';document.body.appendChild(a);a.click();a.remove();
};
if(clave){$('gateErr').textContent='Cargando…';cargar().then(mostrar).catch(e=>salir(e.m))}
})();
</script>
</body>
</html>
